<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05020f">
<title>NEON INVADERS</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neon Invaders">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="270" height="480"></canvas>

  <section id="lobby" class="screen">
    <h1 class="title"><span class="t1">NEON</span><span class="t2">INVADERS</span></h1>
    <p class="sub">15 WAVES &middot; 3 LIVES</p>
    <p class="label">CHOOSE POWER-UP</p>
    <div class="cards">
      <button class="card" data-power="shield" type="button">
        <canvas class="icon" data-icon="shield"></canvas>
        <b>SHIELD</b>
        <small>BLOCKS ALL HITS<br>FOR 6 SECONDS</small>
      </button>
      <button class="card" data-power="laser" type="button">
        <canvas class="icon" data-icon="laser"></canvas>
        <b>GIANT LASER</b>
        <small>MELTS EVERYTHING<br>IN ITS PATH</small>
      </button>
    </div>
    <button id="startBtn" class="btn" type="button">START</button>
    <p class="hint">DRAG TO MOVE<br>SHIP FIRES ONLY WHILE MOVING<br><br>BAR FULL: HOLD STILL 2 SEC<br>TO ACTIVATE</p>
  </section>

  <section id="end" class="screen hidden">
    <h2 id="endTitle">GAME OVER</h2>
    <p id="endStats"></p>
    <button id="retryBtn" class="btn" type="button">RETRY</button>
    <button id="lobbyBtn" class="btn alt" type="button">LOBBY</button>
  </section>
</div>
<script src="js/sprites.js"></script>
<script src="js/game.js"></script>
</body>
</html>
